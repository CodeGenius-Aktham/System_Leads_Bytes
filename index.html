<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bytes Technology · Sistema de Leads</title>
  <meta name="description" content="Sistema de organización y clasificación de leads por sector y estado comercial — Bytes Technology." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260916h" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/base.css?v=20260916h" />
  <link rel="stylesheet" href="styles/layout.css?v=20260916h" />
  <link rel="stylesheet" href="styles/components.css?v=20260916h" />
</head>
<body>
  <!-- ============ HEADER GLOBAL (estático) ============ -->
  <header class="app-header" id="app-header">
    <div class="app-header__inner">
      <button class="brand" type="button" aria-label="Bytes Technology — volver al inicio">
        <img class="brand__mark" src="assets/isotipo-ui.svg?v=20260916h" alt="Bytes Technology" />
      </button>

      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-btn" type="button" data-view="leads">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </button>
        <button class="nav-btn" type="button" data-view="clasificados">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
          Clasificados
        </button>
      </nav>

      <div class="header-meta">
        <!-- Alcance: solo los leads asignados a quien está operando -->
        <label class="scope is-hidden" id="scope-toggle">
          <input class="scope__input" type="checkbox" id="scope-input" />
          <span class="scope__track"><span class="scope__knob"></span></span>
          <span class="scope__label">Solo mis leads</span>
        </label>

        <!-- Sesión iniciada (con Firebase) -->
        <div class="session is-hidden" id="session-box">
          <span class="session__avatar" id="session-avatar"></span>
          <span class="session__name" id="session-name"></span>
          <button class="session__out" type="button" id="session-out" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
        </div>

        <!-- Quién opera este equipo (solo en modo local, sin Firebase) -->
        <label class="who is-hidden" for="who-select" id="who-box">
          <span class="who__label">Soy</span>
          <select class="who__select" id="who-select" aria-label="Responsable que opera este dispositivo"></select>
        </label>

        <!-- Estado del canal compartido -->
        <span class="sync-pill" id="sync-pill" title="">
          <span class="sync-pill__dot"></span>
          <span class="sync-pill__text">—</span>
        </span>

        <span class="header-meta__badge" id="global-total">—</span>
        <span class="header-meta__label">leads en base</span>
      </div>
    </div>
  </header>

  <!-- ============ CONTENEDOR DE VISTAS ============ -->
  <main class="app-main" id="app-root">
    <!-- Pantalla inicial: sin módulo elegido, solo la marca -->
    <section class="view view--home" id="view-home" data-view="home">
      <div class="brand-hero" role="img" aria-label="Bytes Technology">
        <img class="brand-hero__mark" src="assets/isotipo.svg?v=20260916h" alt="" />
        <span class="brand-hero__word">Bytes</span>
      </div>
    </section>

    <section class="view is-hidden" id="view-leads" data-view="leads"></section>
    <section class="view is-hidden" id="view-clasificados" data-view="clasificados"></section>
  </main>

  <!-- ============ TOASTS ============ -->
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <!-- ============ CAPA DE APLICACIÓN ============ -->
  <!-- Los ?v= evitan que el navegador sirva CSS/JS cacheados tras un deploy.
       Subir el número al publicar cambios (ver README > Publicar cambios). -->
  <!-- Orden de carga: config -> utils -> data -> firebase/sync/auth -> store -> componentes -> bootstrap -->
  <script src="src/config.js?v=20260916h"></script>
  <script src="src/utils/dom.js?v=20260916h"></script>
  <script src="src/utils/format.js?v=20260916h"></script>
  <script src="src/data/leads.js?v=20260916h"></script>
  <script src="src/store/firebase.js?v=20260916h"></script>
  <script src="src/store/sync.js?v=20260916h"></script>
  <script src="src/store/auth.js?v=20260916h"></script>
  <script src="src/store/store.js?v=20260916h"></script>
  <script src="src/components/LoginGate.js?v=20260916h"></script>
  <script src="src/components/Header.js?v=20260916h"></script>
  <script src="src/components/StatusFilterBar.js?v=20260916h"></script>
  <script src="src/components/SectorFolders.js?v=20260916h"></script>
  <script src="src/components/LeadList.js?v=20260916h"></script>
  <script src="src/components/LeadDetail.js?v=20260916h"></script>
  <script src="src/components/LeadsView.js?v=20260916h"></script>
  <script src="src/components/KpiPanel.js?v=20260916h"></script>
  <script src="src/components/KanbanBoard.js?v=20260916h"></script>
  <script src="src/components/ClassifiedView.js?v=20260916h"></script>
  <script src="src/main.js?v=20260916h"></script>
</body>
</html>
